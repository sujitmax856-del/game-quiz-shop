<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Quiz Shop</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 420px;
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #475569;
            border-radius: 10px;
            background: #0f172a;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #22c55e;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }

        button:hover {
            background: #16a34a;
        }

        .secondary {
            background: #334155;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            color: #86efac;
        }

        .error {
            color: #f87171;
        }

        .hidden {
            display: none;
        }

        .user-box {
            text-align: center;
        }

        .coins {
            font-size: 24px;
            margin: 20px 0;
        }
    </style>
</head>

<body>

<div class="container">

    <div id="authSection">

        <h1>🎮 Game Quiz Shop</h1>

        <p class="subtitle">Create your account or login</p>

        <input
            type="email"
            id="email"
            placeholder="Email address"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="register()">
            Create Account
        </button>

        <button class="secondary" onclick="login()">
            Login
        </button>

        <div id="message" class="message"></div>

    </div>

    <div id="userSection" class="user-box hidden">

        <h1>🎮 Welcome!</h1>

        <p>You are successfully logged in.</p>

        <div class="coins">
            🪙 Coins: <span id="coins">0</span>
        </div>

        <button onclick="logout()">
            Logout
        </button>

    </div>

</div>

<script>

const SUPABASE_URL = "https://pkcsbazsqkhoxqfadvkp.supabase.co";

const SUPABASE_KEY = "sb_publishable_wNkohhRTugNOEHChrPEOWQ_OVqRFL6y";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function register() {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const message = document.getElementById("message");

    message.className = "message";

    if (!email || !password) {
        message.textContent = "Please enter your email and password.";
        message.className = "message error";
        return;
    }

    if (password.length < 6) {
        message.textContent = "Password must be at least 6 characters.";
        message.className = "message error";
        return;
    }

    const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password
    });

    if (error) {
        message.textContent = error.message;
        message.className = "message error";
        return;
    }

    if (data.user && !data.session) {
        message.textContent =
            "Account created. Please check your email to confirm your account.";
        return;
    }

    message.textContent = "Account created successfully!";

    showUser(data.user);
}

async function login() {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const message = document.getElementById("message");

    message.className = "message";

    if (!email || !password) {
        message.textContent = "Please enter your email and password.";
        message.className = "message error";
        return;
    }

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

    if (error) {
        message.textContent = error.message;
        message.className = "message error";
        return;
    }

    showUser(data.user);
}

async function logout() {

    await supabaseClient.auth.signOut();

    document.getElementById("authSection")
        .classList.remove("hidden");

    document.getElementById("userSection")
        .classList.add("hidden");

    document.getElementById("message").textContent = "";
}

function showUser(user) {

    document.getElementById("authSection")
        .classList.add("hidden");

    document.getElementById("userSection")
        .classList.remove("hidden");
}

async function checkUser() {

    const { data } =
        await supabaseClient.auth.getSession();

    if (data.session) {
        showUser(data.session.user);
    }
}

supabaseClient.auth.onAuthStateChange(
    (event, session) => {

        if (session) {
            showUser(session.user);
        }
    }
);

checkUser();

</script>

</body>
</html>
