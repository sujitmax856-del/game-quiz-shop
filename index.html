<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Quiz Shop - Daily Rewards</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: #1e293b;
            padding: 35px 25px;
            border-radius: 20px;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 30px;
        }

        .subtitle {
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        .coins {
            background: #334155;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 22px;
            font-weight: bold;
        }

        .reward-box {
            background: #0f172a;
            padding: 25px;
            border-radius: 15px;
        }

        .reward {
            font-size: 42px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #22c55e;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background: #64748b;
            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;
            color: #86efac;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎮 Game Quiz Shop</h1>

        <p class="subtitle">Daily Rewards</p>

        <div class="coins">
            🪙 Coins: <span id="coins">0</span>
        </div>

        <div class="reward-box">

            <div class="reward">🎁</div>

            <h2>Daily Reward</h2>

            <p>Claim your daily reward and receive 10 to 15 coins!</p>

            <button id="claimButton" onclick="claimReward()">
                Claim Reward
            </button>

            <div id="message"></div>

        </div>

    </div>

    <script>
        let coins = Number(localStorage.getItem("coins")) || 0;

        const coinsElement = document.getElementById("coins");
        const claimButton = document.getElementById("claimButton");
        const message = document.getElementById("message");

        coinsElement.textContent = coins;

        function claimReward() {
            const today = new Date().toDateString();
            const lastClaim = localStorage.getItem("lastClaim");

            if (lastClaim === today) {
                message.textContent = "You have already claimed today's reward!";
                claimButton.disabled = true;
                return;
            }

            // Random reward between 10 and 15 coins
            const reward = Math.floor(Math.random() * 6) + 10;

            coins += reward;

            localStorage.setItem("coins", coins);
            localStorage.setItem("lastClaim", today);

            coinsElement.textContent = coins;

            message.textContent =
                "🎉 Congratulations! You received " + reward + " coins.";

            claimButton.disabled = true;
        }

        const today = new Date().toDateString();
        const lastClaim = localStorage.getItem("lastClaim");

        if (lastClaim === today) {
            claimButton.disabled = true;
            message.textContent = "You have already claimed today's reward!";
        }
    </script>

</body>
</html>
