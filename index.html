<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Quiz Shop</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 40px auto;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        h1 {
            text-align: center;
            margin: 0 0 10px;
            font-size: 30px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid #475569;
            border-radius: 10px;
            background: #0f172a;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #6366f1;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: #6366f1;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .secondary {
            background: #334155;
        }

        .logout {
            background: #ef4444;
        }

        .reward {
            background: #16a34a;
        }

        .coins {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 18px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin: 20px 0;
        }

        .user-email {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            word-break: break-word;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            min-height: 20px;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }

        .feature-title {
            text-align: center;
            font-size: 22px;
            margin: 30px 0 15px;
        }

        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 20px auto;
        }

        .wheel {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border: 8px solid #f8fafc;
            background: conic-gradient(
                #ef4444 0deg 60deg,
                #f59e0b 60deg 120deg,
                #22c55e 120deg 180deg,
                #06b6d4 180deg 240deg,
                #3b82f6 240deg 300deg,
                #8b5cf6 300deg 360deg
            );
            position: relative;
            transition: transform 4s cubic-bezier(0.15, 0.85, 0.25, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .wheel-label {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 70px;
            height: 30px;
            margin-left: -35px;
            margin-top: -15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 3px black;
        }

        .label-5 {
            transform: rotate(30deg) translateY(-105px) rotate(-30deg);
        }

        .label-10 {
            transform: rotate(90deg) translateY(-105px) rotate(-90deg);
        }

        .label-15 {
            transform: rotate(150deg) translateY(-105px) rotate(-150deg);
        }

        .label-20 {
            transform: rotate(210deg) translateY(-105px) rotate(-210deg);
        }

        .label-25 {
            transform: rotate(270deg) translateY(-105px) rotate(-270deg);
        }

        .label-50 {
            transform: rotate(330deg) translateY(-105px) rotate(-330deg);
        }

        .wheel-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid white;
            z-index: 5;
            filter: drop-shadow(0 2px 3px black);
        }

        .wheel-center {
            position: absolute;
            width: 65px;
            height: 65px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: #0f172a;
            border: 5px solid white;
            border-radius: 50%;
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .spin-button {
            background: #f59e0b;
            color: #111827;
            font-size: 18px;
        }

        .spin-button:hover {
            background: #d97706;
        }

        .info {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div id="authSection">

            <h1>🎮 Game Quiz Shop</h1>

            <p class="subtitle">
                Create your account or login
            </p>

            <input
                type="email"
                id="email"
                placeholder="Email address"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
            >

            <button onclick="register()">
                Create Account
            </button>

            <button class="secondary" onclick="login()">
                Login
            </button>

            <div id="message" class="message"></div>

        </div>


        <div id="userSection" class="hidden">

            <h1>🎮 Welcome!</h1>

            <p class="subtitle">
                You are successfully logged in.
            </p>

            <p id="userEmail" class="user-email"></p>

            <div class="coins">
                🪙 Coins: <span id="coins">0</span>
            </div>


            <h2 class="feature-title">
                🎁 Daily Reward
            </h2>

            <button
                id="dailyRewardButton"
                class="reward"
                onclick="claimDailyReward()"
            >
                🎁 Claim Daily Reward
            </button>

            <div id="rewardMessage" class="message"></div>


            <h2 class="feature-title">
                🎡 Spin Wheel
            </h2>

            <div class="wheel-container">

                <div class="wheel-pointer"></div>

                <div id="wheel" class="wheel">

                    <div class="wheel-label label-5">
                        5 🪙
                    </div>

                    <div class="wheel-label label-10">
                        10 🪙
                    </div>

                    <div class="wheel-label label-15">
                        15 🪙
                    </div>

                    <div class="wheel-label label-20">
                        20 🪙
                    </div>

                    <div class="wheel-label label-25">
                        25 🪙
                    </div>

                    <div class="wheel-label label-50">
                        50 🪙
                    </div>

                    <div class="wheel-center">
                        🎡
                    </div>

                </div>

            </div>

            <button
                id="spinButton"
                class="spin-button"
                onclick="spinWheel()"
            >
                🎡 SPIN NOW
            </button>

            <p class="info">
                One free spin every day
            </p>

            <div id="spinMessage" class="message"></div>


            <button
                class="logout"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </div>

</div>


<script>

    const SUPABASE_URL =
        "https://pkcsbazsqkhoxqfadvkp.supabase.co";

    const SUPABASE_KEY =
        "YOUR_SUPABASE_PUBLISHABLE_KEY";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    let wheelRotation = 0;


    function showMessage(text, success = false) {

        const message =
            document.getElementById("message");

        message.textContent = text;

        message.style.color =
            success ? "#4ade80" : "#f87171";
    }


    function showRewardMessage(text, success = false) {

        const message =
            document.getElementById("rewardMessage");

        message.textContent = text;

        message.style.color =
            success ? "#4ade80" : "#f87171";
    }


    function showSpinMessage(text, success = false) {

        const message =
            document.getElementById("spinMessage");

        message.textContent = text;

        message.style.color =
            success ? "#4ade80" : "#f87171";
    }


    async function register() {

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        if (!email || !password) {
            showMessage("Please enter email and password.");
            return;
        }

        if (password.length < 6) {
            showMessage(
                "Password must be at least 6 characters."
            );
            return;
        }

        showMessage(
            "Creating account...",
            true
        );

        const { data, error } =
            await supabaseClient.auth.signUp({
                email: email,
                password: password
            });

        if (error) {
            showMessage(error.message);
            return;
        }

        if (data.user && !data.session) {

            showMessage(
                "Account created. Please confirm your email before login.",
                true
            );

        } else if (data.user) {

            showMessage(
                "Account created successfully!",
                true
            );

            showUser(data.user);

            await loadProfile();
        }
    }


    async function login() {

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        if (!email || !password) {
            showMessage(
                "Please enter email and password."
            );
            return;
        }

        showMessage(
            "Logging in...",
            true
        );

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) {
            showMessage(error.message);
            return;
        }

        showMessage(
            "Login successful!",
            true
        );

        showUser(data.user);

        await loadProfile();
    }


    async function loadProfile() {

        const {
            data: { user }
        } =
            await supabaseClient.auth.getUser();

        if (!user) {
            return;
        }

        const { data, error } =
            await supabaseClient
                .from("profiles")
                .select(
                    "coins, last_daily_claim, last_spin_claim"
                )
                .eq("user_id", user.id)
                .single();

        if (error) {

            console.error(
                "Profile error:",
                error
            );

            return;
        }

        if (data) {

            document.getElementById("coins").textContent =
                data.coins ?? 0;

            updateDailyRewardButton(
                data.last_daily_claim
            );

            updateSpinButton(
                data.last_spin_claim
            );
        }
    }


    function updateDailyRewardButton(lastClaim) {

        const button =
            document.getElementById(
                "dailyRewardButton"
            );

        if (!lastClaim) {

            button.disabled = false;

            button.textContent =
                "🎁 Claim Daily Reward";

            return;
        }

        const claimDate =
            new Date(lastClaim);

        const now =
            new Date();

        const sameDay =
            claimDate.getUTCFullYear() ===
                now.getUTCFullYear() &&
            claimDate.getUTCMonth() ===
                now.getUTCMonth() &&
            claimDate.getUTCDate() ===
                now.getUTCDate();

        if (sameDay) {

            button.disabled = true;

            button.textContent =
                "✅ Reward Already Claimed";

        } else {

            button.disabled = false;

            button.textContent =
                "🎁 Claim Daily Reward";
        }
    }


    function updateSpinButton(lastSpin) {

        const button =
            document.getElementById(
                "spinButton"
            );

        if (!lastSpin) {

            button.disabled = false;

            button.textContent =
                "🎡 SPIN NOW";

            return;
        }

        const spinDate =
            new Date(lastSpin);

        const now =
            new Date();

        const sameDay =
            spinDate.getUTCFullYear() ===
                now.getUTCFullYear() &&
            spinDate.getUTCMonth() ===
                now.getUTCMonth() &&
            spinDate.getUTCDate() ===
                now.getUTCDate();

        if (sameDay) {

            button.disabled = true;

            button.textContent =
                "✅ Spin Already Used";

        } else {

            button.disabled = false;

            button.textContent =
                "🎡 SPIN NOW";
        }
    }


    async function claimDailyReward() {

        const button =
            document.getElementById(
                "dailyRewardButton"
            );

        button.disabled = true;

        button.textContent =
            "⏳ Claiming...";

        showRewardMessage(
            "Processing reward...",
            true
        );

        const { data, error } =
            await supabaseClient.rpc(
                "claim_daily_reward"
            );

        if (error) {

            console.error(
                "Daily reward error:",
                error
            );

            showRewardMessage(
                "Unable to claim reward. Please try again."
            );

            button.disabled = false;

            button.textContent =
                "🎁 Claim Daily Reward";

            return;
        }

        if (!data) {

            showRewardMessage(
                "No response from server."
            );

            button.disabled = false;

            button.textContent =
                "🎁 Claim Daily Reward";

            return;
        }

        if (!data.success) {

            showRewardMessage(
                data.message
            );

            if (
                data.message ===
                "Daily reward already claimed"
            ) {

                button.disabled = true;

                button.textContent =
                    "✅ Reward Already Claimed";

            } else {

                button.disabled = false;

                button.textContent =
                    "🎁 Claim Daily Reward";
            }

            return;
        }

        document.getElementById(
            "coins"
        ).textContent = data.coins;

        showRewardMessage(
            "🎉 You received " +
            data.reward +
            " coins!",
            true
        );

        button.disabled = true;

        button.textContent =
            "✅ Reward Already Claimed";
    }


    async function spinWheel() {

        const button =
            document.getElementById(
                "spinButton"
            );

        const wheel =
            document.getElementById(
                "wheel"
            );

        button.disabled = true;

        button.textContent =
            "⏳ Spinning...";

        showSpinMessage(
            "Good luck! 🎉",
            true
        );


        const { data, error } =
            await supabaseClient.rpc(
                "spin_wheel"
            );


        if (error) {

            console.error(
                "Spin error:",
                error
            );

            showSpinMessage(
                "Unable to spin. Please try again."
            );

            button.disabled = false;

            button.textContent =
                "🎡 SPIN NOW";

            return;
        }


        if (!data) {

            showSpinMessage(
                "No response from server."
            );

            button.disabled = false;

            button.textContent =
                "🎡 SPIN NOW";

            return;
        }


        if (!data.success) {

            showSpinMessage(
                data.message
            );

            if (
                data.message ===
                "Free spin already used today"
            ) {

                button.disabled = true;

                button.textContent =
                    "✅ Spin Already Used";

            } else {

                button.disabled = false;

                button.textContent =
                    "🎡 SPIN NOW";
            }

            return;
        }


        const reward =
            Number(data.reward);


        const rewardIndex = {
            5: 0,
            10: 1,
            15: 2,
            20: 3,
            25: 4,
            50: 5
        }[reward];


        const segmentCenter =
            rewardIndex * 60 + 30;


        const targetRotation =
            360 * 6 +
            (360 - segmentCenter);


        wheelRotation +=
            targetRotation;


        wheel.style.transform =
            "rotate(" +
            wheelRotation +
            "deg)";


        setTimeout(function() {

            document.getElementById(
                "coins"
            ).textContent =
                data.coins;

            showSpinMessage(
                "🎉 You won " +
                reward +
                " coins!",
                true
            );

            button.disabled = true;

            button.textContent =
                "✅ Spin Already Used";

        }, 4200);
    }


    function showUser(user) {

        document
            .getElementById("authSection")
            .classList.add("hidden");

        document
            .getElementById("userSection")
            .classList.remove("hidden");

        document.getElementById(
            "userEmail"
        ).textContent =
            user.email || "";
    }


    function showLogin() {

        document
            .getElementById("userSection")
            .classList.add("hidden");

        document
            .getElementById("authSection")
            .classList.remove("hidden");
    }


    async function logout() {

        await supabaseClient.auth.signOut();

        showLogin();

        document.getElementById(
            "coins"
        ).textContent = "0";

        document.getElementById(
            "userEmail"
        ).textContent = "";

        showRewardMessage("");

        showSpinMessage("");
    }


    async function checkUser() {

        const {
            data: { session }
        } =
            await supabaseClient.auth.getSession();

        if (
            session &&
            session.user
        ) {

            showUser(session.user);

            await loadProfile();

        } else {

            showLogin();
        }
    }


    supabaseClient.auth.onAuthStateChange(
        async (event, session) => {

            if (
                session &&
                session.user
            ) {

                showUser(session.user);

                await loadProfile();

            } else {

                showLogin();
            }
        }
    );


    checkUser();

</script>

</body>
</html>
